name: Publish container packages

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - '*.sh'
      - docker/**
      - tests/docker_smoke.py
      - .github/workflows/publish-packages.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Ubuntu ${{ matrix.ubuntu }} / ROS ${{ matrix.ros }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '22.04'
            ros: humble
          - ubuntu: '24.04'
            ros: jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Set package name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/gazebo-ros2-web-ubuntu${{ matrix.ubuntu }}" >> "$GITHUB_ENV"
      - name: Build edition
        run: |
          docker build --build-arg UBUNTU_VERSION=${{ matrix.ubuntu }} \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version=ubuntu${{ matrix.ubuntu }} \
            -t gazebo-ros2-web:${{ matrix.ros }} .
      - name: Test desktop, ROS, simulation and lifecycle
        run: |
          python3 tests/docker_smoke.py gazebo-ros2-web:${{ matrix.ros }} \
            --output /tmp/package-evidence/${{ matrix.ros }}.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish this edition after tests pass
        run: |
          docker tag gazebo-ros2-web:${{ matrix.ros }} "$IMAGE:latest"
          docker tag gazebo-ros2-web:${{ matrix.ros }} "$IMAGE:${{ matrix.ros }}"
          docker tag gazebo-ros2-web:${{ matrix.ros }} "$IMAGE:sha-$GITHUB_SHA"
          docker push --all-tags "$IMAGE"
          docker buildx imagetools inspect "$IMAGE:latest"
          {
            echo '### Ubuntu ${{ matrix.ubuntu }} / ROS ${{ matrix.ros }}'
            echo "Published: \`$IMAGE:latest\`"
            echo "Commit tag: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo 'All 19 container checks passed before publication.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save registry publication receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="gazebo-ros2-web-ubuntu${{ matrix.ubuntu }}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}" \
            > /tmp/package-evidence/${{ matrix.ros }}-registry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence-${{ matrix.ros }}
          path: /tmp/package-evidence/
