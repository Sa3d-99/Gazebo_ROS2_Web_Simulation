name: Docker integration

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            ros: humble
          - ubuntu: "24.04"
            ros: jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg UBUNTU_VERSION=${{ matrix.ubuntu }} -t gazebo-ros2-web:${{ matrix.ros }} .
      - name: Run container integration tests
        run: python3 tests/docker_smoke.py gazebo-ros2-web:${{ matrix.ros }} --output /tmp/docker-results/${{ matrix.ros }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence-${{ matrix.ros }}
          path: /tmp/docker-results/
